# Replace host, checkout path and PHP-FPM socket for your actual server.
# Add HTTPS using your deployment's certificate configuration.
server {
    listen 80;
    server_name example.com;
    root /var/www/kasnakliyat/public;
    index index.php;
    client_max_body_size 10m;
    location / {
        try_files $uri /index.php$is_args$args;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
